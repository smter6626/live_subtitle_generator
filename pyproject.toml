[project]
name = "classroom-live-transcriber"
version = "0.1.0"
description = "Local live classroom transcription for macOS Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.2",
    "PySide6==6.11.1",
    "sounddevice==0.5.6",
]

[dependency-groups]
dev = [
    "PyInstaller==6.22.1",
]

[tool.uv]
package = false
